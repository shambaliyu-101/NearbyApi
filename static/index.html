<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NearbyAPI — Spatial Dispatch Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    canvas {
      image-rendering: pixelated;
      cursor: crosshair;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col h-screen font-sans">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur px-6 py-3 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/20">
        N
      </div>
      <div>
        <h1 class="text-base font-semibold tracking-wide">NearbyAPI Spatial Engine</h1>
        <p class="text-xs text-slate-400">QuadTree 2D Indexing & Dispatch Dashboard</p>
      </div>
    </div>

    <!-- Auth / Region Bar -->
    <div class="flex items-center space-x-4">
      <div id="authStatus" class="text-xs text-slate-400">
        Status: <span id="authBadge" class="text-amber-400 font-medium">Logged Out</span>
      </div>
      <button id="openAuthModalBtn" class="px-3 py-1.5 rounded-md text-xs font-medium bg-slate-800 hover:bg-slate-700 transition">
        Login
      </button>
    </div>
  </header>

  <!-- Main Workspace -->
  <div class="flex flex-1 overflow-hidden">
    
    <!-- Left Sidebar: Controls -->
    <aside class="w-80 border-r border-slate-800 bg-slate-900/50 p-5 flex flex-col space-y-6 overflow-y-auto">
      
      <!-- Region Selector -->
      <div>
        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Active Region</label>
        <div class="flex space-x-2">
          <select id="regionSelect" class="flex-1 bg-slate-800 border border-slate-700 rounded-md px-3 py-2 text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            <option value="">Select a region...</option>
          </select>
          <button id="refreshRegionsBtn" class="px-2 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-md text-xs">🔄</button>
        </div>
        <div class="mt-2 flex space-x-2">
          <input id="newRegionName" placeholder="New region name..." class="flex-1 bg-slate-800 border border-slate-700 rounded-md px-3 py-1.5 text-xs focus:ring-1 focus:ring-indigo-500 focus:outline-none" />
          <button id="createRegionBtn" class="bg-indigo-600 hover:bg-indigo-500 px-3 py-1.5 rounded-md text-xs font-medium">Add</button>
        </div>
      </div>

      <!-- Action Mode -->
      <div>
        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Click Canvas Mode</label>
        <div class="grid grid-cols-2 gap-2">
          <button data-mode="add_point" class="mode-btn active bg-indigo-600 border border-indigo-500 px-3 py-2 rounded-md text-xs font-medium flex items-center justify-center space-x-1">
            <span>📍 Drop Point</span>
          </button>
          <button data-mode="add_zone" class="mode-btn bg-slate-800 border border-slate-700 hover:bg-slate-700 px-3 py-2 rounded-md text-xs font-medium flex items-center justify-center space-x-1">
            <span>⭕ Drop Zone</span>
          </button>
          <button data-mode="query_knn" class="mode-btn bg-slate-800 border border-slate-700 hover:bg-slate-700 px-3 py-2 rounded-md text-xs font-medium flex items-center justify-center space-x-1">
            <span>🎯 Find k-NN</span>
          </button>
          <button data-mode="query_box" class="mode-btn bg-slate-800 border border-slate-700 hover:bg-slate-700 px-3 py-2 rounded-md text-xs font-medium flex items-center justify-center space-x-1">
            <span>📐 Box Search</span>
          </button>
        </div>
      </div>

      <!-- Parameters -->
      <div id="paramControls" class="space-y-3 bg-slate-950/60 p-3 rounded-md border border-slate-800/80">
        <div id="zoneRadiusControl" class="hidden">
          <label class="block text-xs text-slate-400 mb-1">Zone Radius: <span id="radiusVal" class="text-indigo-400 font-bold">40</span></label>
          <input id="radiusInput" type="range" min="10" max="150" value="40" class="w-full h-1 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-indigo-500" />
        </div>
        <div id="knnLimitControl">
          <label class="block text-xs text-slate-400 mb-1">k-NN Nearest Count (k): <span id="limitVal" class="text-indigo-400 font-bold">5</span></label>
          <input id="knnLimitInput" type="range" min="1" max="15" value="5" class="w-full h-1 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-indigo-500" />
        </div>
      </div>

      <!-- Query Results Log -->
      <div class="flex-1 flex flex-col">
        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Query Stats & Results</label>
        <div id="resultsLog" class="flex-1 bg-slate-950 p-3 rounded-md border border-slate-800 font-mono text-[11px] overflow-y-auto space-y-1.5 text-slate-300">
          <div class="text-slate-500 italic">Select a region and drop points or run spatial searches.</div>
        </div>
      </div>

    </aside>

    <!-- Canvas Area -->
    <main class="flex-1 relative bg-slate-950 flex flex-col items-center justify-center p-4">
      <div class="relative w-full h-full flex items-center justify-center">
        <canvas id="spatialCanvas" width="900" height="600" class="bg-slate-900 border border-slate-800 rounded-lg shadow-2xl"></canvas>
        <div class="absolute bottom-6 right-6 bg-slate-950/80 backdrop-blur px-3 py-1.5 rounded-md border border-slate-800 text-[11px] text-slate-400 pointer-events-none">
          Grid: 900 x 600 | Coordinates: <span id="coordDisplay">0, 0</span>
        </div>
      </div>
    </main>

  </div>

  <!-- Login Modal -->
  <div id="authModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-xl p-6 shadow-2xl">
      <h3 class="text-base font-semibold mb-4 text-white">Sign In to NearbyAPI</h3>
      <div class="space-y-3">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Email</label>
          <input id="loginEmail" type="email" value="dev1@example.com" class="w-full bg-slate-800 border border-slate-700 rounded-md px-3 py-2 text-xs focus:ring-1 focus:ring-indigo-500 focus:outline-none" />
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Password</label>
          <input id="loginPassword" type="password" value="testpassword123" class="w-full bg-slate-800 border border-slate-700 rounded-md px-3 py-2 text-xs focus:ring-1 focus:ring-indigo-500 focus:outline-none" />
        </div>
        <div class="pt-2 flex justify-end space-x-2">
          <button id="closeAuthModalBtn" class="px-3 py-1.5 text-xs text-slate-400 hover:text-white">Cancel</button>
          <button id="submitLoginBtn" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-1.5 rounded-md text-xs font-medium">Log In</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let token = localStorage.getItem("nearby_token") || null;
    let activeRegionId = null;
    let currentMode = "add_point";
    let locations = [];
    let queryHighlights = [];
    let boxStart = null;
    let boxCurrent = null;

    const canvas = document.getElementById("spatialCanvas");
    const ctx = canvas.getContext("2d");

    // UI Elements
    const authBadge = document.getElementById("authBadge");
    const openAuthModalBtn = document.getElementById("openAuthModalBtn");
    const authModal = document.getElementById("authModal");
    const closeAuthModalBtn = document.getElementById("closeAuthModalBtn");
    const submitLoginBtn = document.getElementById("submitLoginBtn");
    const regionSelect = document.getElementById("regionSelect");
    const refreshRegionsBtn = document.getElementById("refreshRegionsBtn");
    const createRegionBtn = document.getElementById("createRegionBtn");
    const newRegionName = document.getElementById("newRegionName");
    const resultsLog = document.getElementById("resultsLog");
    const coordDisplay = document.getElementById("coordDisplay");
    const radiusInput = document.getElementById("radiusInput");
    const radiusVal = document.getElementById("radiusVal");
    const knnLimitInput = document.getElementById("knnLimitInput");
    const limitVal = document.getElementById("limitVal");

    // Mode switching
    document.querySelectorAll(".mode-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".mode-btn").forEach(b => {
          b.classList.remove("active", "bg-indigo-600", "border-indigo-500");
          b.classList.add("bg-slate-800", "border-slate-700");
        });
        btn.classList.add("active", "bg-indigo-600", "border-indigo-500");
        btn.classList.remove("bg-slate-800", "border-slate-700");
        currentMode = btn.dataset.mode;

        document.getElementById("zoneRadiusControl").classList.toggle("hidden", currentMode !== "add_zone");
        document.getElementById("knnLimitControl").classList.toggle("hidden", currentMode !== "query_knn");
        queryHighlights = [];
        drawCanvas();
      });
    });

    radiusInput.addEventListener("input", (e) => radiusVal.textContent = e.target.value);
    knnLimitInput.addEventListener("input", (e) => limitVal.textContent = e.target.value);

    // Auth Modal
    openAuthModalBtn.addEventListener("click", () => authModal.classList.remove("hidden"));
    closeAuthModalBtn.addEventListener("click", () => authModal.classList.add("hidden"));

    function updateAuthUI() {
      if (token) {
        authBadge.textContent = "Authorized";
        authBadge.className = "text-emerald-400 font-medium";
        openAuthModalBtn.textContent = "Switch Account";
        loadRegions();
      } else {
        authBadge.textContent = "Logged Out";
        authBadge.className = "text-amber-400 font-medium";
        openAuthModalBtn.textContent = "Login";
      }
    }

    submitLoginBtn.addEventListener("click", async () => {
      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;
      try {
        const res = await fetch("/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });
        if (!res.ok) throw new Error("Login failed");
        const data = await res.json();
        token = data.access_token;
        localStorage.setItem("nearby_token", token);
        authModal.classList.add("hidden");
        updateAuthUI();
      } catch (err) {
        alert(err.message);
      }
    });

    async function apiFetch(url, options = {}) {
      const headers = options.headers || {};
      if (token) headers["Authorization"] = `Bearer ${token}`;
      const res = await fetch(url, { ...options, headers });
      if (res.status === 401) {
        token = null;
        localStorage.removeItem("nearby_token");
        updateAuthUI();
        throw new Error("Session expired. Please log in again.");
      }
      return res;
    }

    async function loadRegions() {
      if (!token) return;
      try {
        const res = await apiFetch("/regions");
        const regions = await res.json();
        regionSelect.innerHTML = '<option value="">Select a region...</option>';
        regions.forEach(r => {
          const opt = document.createElement("option");
          opt.value = r.id;
          opt.textContent = r.name;
          regionSelect.appendChild(opt);
        });
        if (regions.length > 0 && !activeRegionId) {
          regionSelect.value = regions[0].id;
          activeRegionId = regions[0].id;
          loadLocations();
        }
      } catch (err) {
        console.error(err);
      }
    }

    refreshRegionsBtn.addEventListener("click", loadRegions);

    createRegionBtn.addEventListener("click", async () => {
      const name = newRegionName.value.trim();
      if (!name) return;
      const res = await apiFetch("/regions", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name }),
      });
      if (res.ok) {
        newRegionName.value = "";
        await loadRegions();
      }
    });

    regionSelect.addEventListener("change", (e) => {
      activeRegionId = e.target.value;
      loadLocations();
    });

    async function loadLocations() {
      if (!activeRegionId) {
        locations = [];
        drawCanvas();
        return;
      }
      try {
        const res = await apiFetch(`/regions/${activeRegionId}/locations`);
        locations = await res.json();
        queryHighlights = [];
        drawCanvas();
        logMessage(`Loaded ${locations.length} locations for current region.`);
      } catch (err) {
        console.error(err);
      }
    }

    function logMessage(text, color = "text-slate-300") {
      const el = document.createElement("div");
      el.className = color;
      el.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
      resultsLog.prepend(el);
    }

    // Canvas Mouse Interaction
    canvas.addEventListener("mousemove", (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = Math.round(e.clientX - rect.left);
      const y = Math.round(e.clientY - rect.top);
      coordDisplay.textContent = `${x}, ${y}`;

      if (currentMode === "query_box" && boxStart) {
        boxCurrent = { x, y };
        drawCanvas();
      }
    });

    canvas.addEventListener("mousedown", async (e) => {
      if (!activeRegionId) {
        alert("Please select or create a region first!");
        return;
      }

      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      if (currentMode === "add_point") {
        await createLocation({ location_type: "point", x, y });
      } else if (currentMode === "add_zone") {
        const radius = parseFloat(radiusInput.value);
        await createLocation({ location_type: "zone", x, y, radius });
      } else if (currentMode === "query_knn") {
        const limit = parseInt(knnLimitInput.value);
        await runKnnQuery(x, y, limit);
      } else if (currentMode === "query_box") {
        boxStart = { x, y };
        boxCurrent = { x, y };
      }
    });

    canvas.addEventListener("mouseup", async (e) => {
      if (currentMode === "query_box" && boxStart) {
        const rect = canvas.getBoundingClientRect();
        const endX = e.clientX - rect.left;
        const endY = e.clientY - rect.top;
        const x1 = Math.min(boxStart.x, endX);
        const y1 = Math.min(boxStart.y, endY);
        const x2 = Math.max(boxStart.x, endX);
        const y2 = Math.max(boxStart.y, endY);
        boxStart = null;
        boxCurrent = null;
        await runRangeQuery(x1, y1, x2, y2);
      }
    });

    async function createLocation(payload) {
      try {
        const res = await apiFetch(`/regions/${activeRegionId}/locations`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        if (res.ok) {
          const loc = await res.json();
          locations.push(loc);
          drawCanvas();
          logMessage(`Created ${payload.location_type} at (${Math.round(loc.x)}, ${Math.round(loc.y)})`);
        }
      } catch (err) {
        console.error(err);
      }
    }

    async function runKnnQuery(x, y, limit) {
      try {
        const t0 = performance.now();
        const res = await apiFetch(`/regions/${activeRegionId}/nearby?x=${x}&y=${y}&limit=${limit}`);
        const data = await res.json();
        const elapsed = (performance.now() - t0).toFixed(2);

        queryHighlights = data.map(item => ({
          target: { x, y },
          loc: item.location,
          distance: item.distance,
        }));
        drawCanvas();
        logMessage(`k-NN found ${data.length} closest items in ${elapsed} ms.`, "text-emerald-400");
      } catch (err) {
        console.error(err);
      }
    }

    async function runRangeQuery(x1, y1, x2, y2) {
      try {
        const t0 = performance.now();
        const res = await apiFetch(`/regions/${activeRegionId}/search?x1=${x1}&y1=${y1}&x2=${x2}&y2=${y2}`);
        const data = await res.json();
        const elapsed = (performance.now() - t0).toFixed(2);

        queryHighlights = data.map(loc => ({ loc, isBox: true }));
        drawCanvas({ x1, y1, x2, y2 });
        logMessage(`Range query returned ${data.length} items in ${elapsed} ms.`, "text-cyan-400");
      } catch (err) {
        console.error(err);
      }
    }

    function drawCanvas(activeBox = null) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw faint background grid
      ctx.strokeStyle = "#1e293b";
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 50) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += 50) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      // Draw active box selection
      if (boxStart && boxCurrent) {
        ctx.fillStyle = "rgba(99, 102, 241, 0.15)";
        ctx.strokeStyle = "#818cf8";
        ctx.lineWidth = 1.5;
        const bx = Math.min(boxStart.x, boxCurrent.x);
        const by = Math.min(boxStart.y, boxCurrent.y);
        const bw = Math.abs(boxCurrent.x - boxStart.x);
        const bh = Math.abs(boxCurrent.y - boxStart.y);
        ctx.fillRect(bx, by, bw, bh);
        ctx.strokeRect(bx, by, bw, bh);
      }

      if (activeBox) {
        ctx.fillStyle = "rgba(6, 182, 212, 0.15)";
        ctx.strokeStyle = "#06b6d4";
        ctx.lineWidth = 2;
        ctx.strokeRect(activeBox.x1, activeBox.y1, activeBox.x2 - activeBox.x1, activeBox.y2 - activeBox.y1);
      }

      // Draw locations
      locations.forEach(loc => {
        const isHighlighted = queryHighlights.some(h => h.loc && h.loc.id === loc.id);

        if (loc.location_type === "zone") {
          ctx.beginPath();
          ctx.arc(loc.x, loc.y, loc.radius || 30, 0, Math.PI * 2);
          ctx.fillStyle = isHighlighted ? "rgba(244, 63, 94, 0.4)" : "rgba(129, 140, 248, 0.2)";
          ctx.fill();
          ctx.strokeStyle = isHighlighted ? "#f43f5e" : "#6366f1";
          ctx.lineWidth = 2;
          ctx.stroke();
        } else {
          ctx.beginPath();
          ctx.arc(loc.x, loc.y, isHighlighted ? 6 : 4, 0, Math.PI * 2);
          ctx.fillStyle = isHighlighted ? "#10b981" : "#38bdf8";
          ctx.fill();
          ctx.strokeStyle = "#ffffff";
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }
      });

      // Draw k-NN connector lines
      queryHighlights.forEach(h => {
        if (h.target && h.loc) {
          ctx.beginPath();
          ctx.moveTo(h.target.x, h.target.y);
          ctx.lineTo(h.loc.x, h.loc.y);
          ctx.strokeStyle = "#10b981";
          ctx.lineWidth = 2;
          ctx.setLineDash([4, 4]);
          ctx.stroke();
          ctx.setLineDash([]);

          // Draw target click marker
          ctx.beginPath();
          ctx.arc(h.target.x, h.target.y, 5, 0, Math.PI * 2);
          ctx.fillStyle = "#f59e0b";
          ctx.fill();
        }
      });
    }

    // Init
    updateAuthUI();
    drawCanvas();
  </script>
</body>
</html>
